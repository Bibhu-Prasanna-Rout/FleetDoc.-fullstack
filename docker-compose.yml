services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fleetdoc
      POSTGRES_USER: fleetdoc
      POSTGRES_PASSWORD: fleetdoc
    ports: ["5432:5432"]
    volumes: [fleetdoc_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U fleetdoc -d fleetdoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  fleetdoc_db:
